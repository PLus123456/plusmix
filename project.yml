# Switcher.xcodeproj 由本文件生成：`make gen`（XcodeGen）。生成物不入库。
# 归属：P0 建骨架；W3-C 加 CameraExtension target；W4-B 做签名 / 公证 / 版本（docs/OWNERSHIP.md）。
name: Switcher

options:
  bundleIdPrefix: com.example            # 占位；正式 bundle id 由 W4-B 定
  deploymentTarget:
    macOS: "15.0"                        # 落地方案 §7 第 8 条：NSView.displayLink 需要 14+，矩阵取当前和上一个大版本
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"           # 必须与 Packages/SwitcherCore/Sources/SwitcherContracts/Version.swift 一致（lint 校验）
    CURRENT_PROJECT_VERSION: "1"
    # Team ID 走环境变量：`DEVELOPMENT_TEAM=XXXXXXXXXX make gen`。不设则为空，走 ad-hoc 签名（"Sign to Run Locally"）。
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SwitcherCore:
    path: Packages/SwitcherCore
  SwitcherInputs:
    path: Packages/SwitcherInputs
  SwitcherAudio:
    path: Packages/SwitcherAudio
  SwitcherOutputs:
    path: Packages/SwitcherOutputs
  SwitcherControl:
    path: Packages/SwitcherControl
  SwitcherTestKit:
    path: Packages/SwitcherTestKit

targets:
  Switcher:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: Switcher
        PRODUCT_BUNDLE_IDENTIFIER: com.example.switcher
        INFOPLIST_FILE: App/Info.plist   # 手写，见文件内注释；不用 XcodeGen 生成（它会把版本写死成 1.0）
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # W3-C：权限表按 DEVELOPMENT_TEAM 选——空（ad-hoc）用空表 App/Switcher.entitlements，有 Team ID 用 App/Switcher-signed.entitlements
        # （system-extension.install 是受限权限，ad-hoc 带着它 Xcode 拒绝构建）。写法：$(DEVELOPMENT_TEAM:default=adhoc) → "adhoc" 或 Team ID，
        # 再查 SWITCHER_ENTITLEMENTS_<它>，只定义了 adhoc 那个，其他（任何 Team ID）落到 default 的签名表。
        SWITCHER_TEAM_KIND: "$(DEVELOPMENT_TEAM:default=adhoc)"
        SWITCHER_ENTITLEMENTS_adhoc: App/Switcher.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(SWITCHER_ENTITLEMENTS_$(SWITCHER_TEAM_KIND):default=App/Switcher-signed.entitlements)"
    dependencies:
      - package: SwitcherCore
        product: SwitcherContracts
      - package: SwitcherCore
        product: SwitcherEngine
      - package: SwitcherCore
        product: SwitcherRender
      - package: SwitcherInputs
      - package: SwitcherAudio
      - package: SwitcherAudio
        product: SwitcherAudioIntegration   # W2-B2：App 接 W2-E 的 AudioEngine
      - package: SwitcherOutputs
      - package: SwitcherOutputs
        product: SwitcherStreaming           # W2-B2：App 接 W2-D 的 StreamOutput
      - package: SwitcherOutputs
        product: SwitcherExternal            # W3-C：外部显示窗口
      - package: SwitcherOutputs
        product: SwitcherISO                 # W3-C：ISO 分路 + 磁盘保护
      - package: SwitcherOutputs
        product: SwitcherVirtualCamera       # W3-C：虚拟摄像头桥 + 扩展安装
      - package: SwitcherControl
      - package: SwitcherTestKit
      - target: SwitcherCameraExtension      # W3-C：嵌到 Contents/Library/SystemExtensions/
        embed: true
        codeSign: true

  # W3-C：虚拟摄像头的 CMIO 系统扩展（CameraExtension/）。产品名 = bundle ID（系统扩展的 bundle 名要求）。
  # 共享常量从 SwitcherVirtualCamera 的 Shared/ 目录按路径编进来。签名需要 Team ID（DEVELOPMENT_TEAM）；没有只能编译。
  SwitcherCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: CameraExtension/Sources
      - path: Packages/SwitcherOutputs/Sources/VirtualCamera/Shared
    settings:
      base:
        PRODUCT_NAME: com.example.switcher.camera-extension
        PRODUCT_BUNDLE_IDENTIFIER: com.example.switcher.camera-extension
        INFOPLIST_FILE: CameraExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  SwitcherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.switcher.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Switcher

schemes:
  Switcher:
    build:
      targets:
        Switcher: all
        SwitcherCameraExtension: all
        SwitcherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SwitcherTests
    profile:
      config: Release
    archive:
      config: Release
