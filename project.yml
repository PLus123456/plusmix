# Switcher.xcodeproj 由本文件生成：`make gen`（XcodeGen）。生成物不入库。
# 归属：P0 建骨架；W3-C 加 CameraExtension target；W4-B 做签名 / 公证 / 版本（docs/OWNERSHIP.md）。
name: Switcher

options:
  bundleIdPrefix: com.plusmix            # 用户 2026-09-28 定（产品名 PlusMix）；G5 用 scripts/release/set-bundle-id.sh 切换，发布后不能改
  deploymentTarget:
    macOS: "15.0"                        # 落地方案 §7 第 8 条：NSView.displayLink 需要 14+，矩阵取当前和上一个大版本
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"           # 必须与 Packages/SwitcherCore/Sources/SwitcherContracts/Version.swift 一致（lint 校验）
    CURRENT_PROJECT_VERSION: "1"
    # 签名三种模式（W4-B3 / prompt 141；docs/release/signing.md"三种签名模式"）。两个输入由 `make gen` 从环境变量写进工程（XcodeGen 的 ${…}）：
    #   DEVELOPMENT_TEAM   不设 → (a) ad-hoc（"Sign to Run Locally"，现状）
    #   SWITCHER_DEV_SIGN  有 Team 时：1 → (b) 开发签名（钥匙串里的 Apple Development 身份，Personal Team 也行：Manual、不要描述文件、App 用开发表）；
    #                      0 → (c) Developer ID（make archive 那条，W4-B，archive.sh 钉 0）；不设 → make gen 看钥匙串自动定
    #                      （scripts/dev-signing/sign-mode.sh：没有该 Team 的 Developer ID 身份、有它的 Apple Development 身份 → 1，否则 0）
    # 派生的 SWITCHER_SIGN_MODE（adhoc / dev / devid）选签名方式、身份和 App 的权限表。写法同 W3-C 的 $(DEVELOPMENT_TEAM:default=adhoc)：
    # 查表只定义 adhoc / dev 两项，其他（devid，任何 Team ID）落到 default，即 W4-B3 之前的 Automatic + "-" + 签名表。
    # 两个输入也能在 xcodebuild 命令行上盖（命令行优先级最高，派生跟着变）：`make build-app DEV_SIGN_TEAM=<Team ID>` 就是不重新生成工程、命令行盖这两个。
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWITCHER_DEV_SIGN: ${SWITCHER_DEV_SIGN}
    SWITCHER_TEAM_KIND: "$(DEVELOPMENT_TEAM:default=adhoc)"
    SWITCHER_DEV_SIGN_KIND: "$(SWITCHER_DEV_SIGN:default=0)"
    SWITCHER_SIGN_MODE_FOR_TEAM_adhoc: adhoc
    SWITCHER_SIGN_MODE_FOR_DEV_1: dev
    SWITCHER_SIGN_MODE: "$(SWITCHER_SIGN_MODE_FOR_TEAM_$(SWITCHER_TEAM_KIND):default=$(SWITCHER_SIGN_MODE_FOR_DEV_$(SWITCHER_DEV_SIGN_KIND):default=devid))"
    # 签名方式分两行：无条件那行是 W4-B3 之前的值，XcodeGen 拿它写 TargetAttributes 的 ProvisioningStyle（它不认宏，写成宏就把宏原样抄进去）；
    # [sdk=macosx*] 那行按模式查表——同一层里带条件的变体优先，本工程只有 macOS，所以构建时总是它生效。这样 (a) / (c) 的 TargetAttributes 与之前一样、构建时取到的值也一样（(c) 本机测不了，R16 逐项比）。
    SWITCHER_CODE_SIGN_STYLE_dev: Manual
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_STYLE[sdk=macosx*]": "$(SWITCHER_CODE_SIGN_STYLE_$(SWITCHER_SIGN_MODE):default=Automatic)"
    SWITCHER_CODE_SIGN_IDENTITY_dev: Apple Development
    CODE_SIGN_IDENTITY: "$(SWITCHER_CODE_SIGN_IDENTITY_$(SWITCHER_SIGN_MODE):default=-)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SwitcherCore:
    path: Packages/SwitcherCore
  SwitcherInputs:
    path: Packages/SwitcherInputs
  SwitcherAudio:
    path: Packages/SwitcherAudio
  SwitcherOutputs:
    path: Packages/SwitcherOutputs
  SwitcherControl:
    path: Packages/SwitcherControl
  SwitcherTestKit:
    path: Packages/SwitcherTestKit
  # W4-B：自动更新（MIT）。二进制 xcframework，钉死版本；升级时 scripts/xcode-workspace-Package.resolved 的 sparkle 一项一起改（scripts/release/pin-deps.sh upgrade）。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Switcher:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
        excludes:
          - Help                             # W4-C2：Help/ 走下面那条 folder reference，不在这里按单个文件进包（否则三个 index.html 撞名）
      - path: App/Resources/Help             # W4-C2：随包 HTML 手册（docs/tools/build-help.py 从 docs/user 生成）；folder reference 整个目录原样进包，zh-Hans/ 与 en/ 的 index.html 不撞名
        type: folder
    settings:
      base:
        PRODUCT_NAME: PlusMix                # W4-D：产品名（用户 2026-09-28 定）→ PlusMix.app / CFBundleName / 可执行名；target / scheme / 模块仍叫代码名 Switcher
        PRODUCT_MODULE_NAME: Switcher        # W4-D：Swift 模块名默认跟 PRODUCT_NAME 走，这里钉住代码名（App/Tests 的 @testable import Switcher、-Swift.h 都靠它）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.plusmix.switcher
        INFOPLIST_FILE: App/Info.plist   # 手写，见文件内注释；不用 XcodeGen 生成（它会把版本写死成 1.0）
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # W4-B：Sparkle 的两个 Info.plist 键从构建设置注入（App/Info.plist 里写 $(SPARKLE_FEED_URL) / $(SPARKLE_PUBLIC_ED_KEY)）。
        # 默认空 = 这份构建不带更新（UpdateController 不起 Sparkle，偏好设置里写"未配置"）；发布构建由 scripts/release/archive.sh 用
        # xcodebuild 的命令行设置传真实值（SPARKLE_FEED_URL / SPARKLE_PUBLIC_ED_KEY 环境变量），私钥永远不进仓库（docs/release/sparkle.md）。
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
        # W4-B：公证要求硬化运行时。ad-hoc 签名时 Xcode 自己会关掉它（构建日志 note: Disabling hardened runtime with ad-hoc codesigning），
        # 有 Team ID 时（开发签名与 Developer ID）生效：摄像头 / 麦克风要权限表里的 device.camera / device.audio-input 两条；库校验开着——
        # Developer ID 由 scripts/release/sign.sh 用同一 Team 重签包内的 libndi.dylib / Sparkle.framework，开发签名不重签、靠开发表关库校验。
        ENABLE_HARDENED_RUNTIME: YES
        # W3-C 起权限表查表选（W4-B3 加开发签名那张，按上面派生的 SWITCHER_SIGN_MODE）：
        #   adhoc → App/Switcher.entitlements（空：system-extension.install 是受限权限，ad-hoc 带着它 Xcode 拒绝构建）
        #   dev   → App/Switcher-dev.entitlements（camera + audio-input + cs.disable-library-validation；不带 system-extension.install，Personal Team 拿不到）
        #   devid → default 的 App/Switcher-signed.entitlements（system-extension.install + camera + audio-input；make archive / sign.sh 走它）
        SWITCHER_ENTITLEMENTS_adhoc: App/Switcher.entitlements
        SWITCHER_ENTITLEMENTS_dev: App/Switcher-dev.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(SWITCHER_ENTITLEMENTS_$(SWITCHER_SIGN_MODE):default=App/Switcher-signed.entitlements)"
    dependencies:
      - package: SwitcherCore
        product: SwitcherContracts
      - package: SwitcherCore
        product: SwitcherEngine
      - package: SwitcherCore
        product: SwitcherRender
      - package: SwitcherInputs
      - package: SwitcherInputs
        product: SwitcherNDI                 # G4：App 接 W3-A 的 NDI 输入（InputFactory）
      - package: SwitcherInputs
        product: SwitcherDeckLink            # G4：App 接 W3-A 的 DeckLink 输入（InputFactory）
      - package: SwitcherAudio
      - package: SwitcherAudio
        product: SwitcherAudioIntegration   # W2-B2：App 接 W2-E 的 AudioEngine
      - package: SwitcherOutputs
      - package: SwitcherOutputs
        product: SwitcherStreaming           # W2-B2：App 接 W2-D 的 StreamOutput
      - package: SwitcherOutputs
        product: SwitcherNDISend             # W3-E3：App 接 W2-D 的 NDISender（OutputRuntime 的 kind = ndi）
      - package: SwitcherOutputs
        product: SwitcherExternal            # W3-C：外部显示窗口
      - package: SwitcherOutputs
        product: SwitcherISO                 # W3-C：ISO 分路 + 磁盘保护
      - package: SwitcherOutputs
        product: SwitcherVirtualCamera       # W3-C：虚拟摄像头桥 + 扩展安装
      - package: SwitcherControl
      - package: SwitcherControl
        product: VMixCompat                  # G4：偏好设置里的第三方 API 兼容层开关（W3-D）
      - package: SwitcherControl
        product: SwitcherTally               # W5-L（98）：设置 › Tally 打开时 App 起只读 tally 流（默认关，Q46）
      - package: SwitcherTestKit
      - package: Sparkle                     # W4-B：自动更新（UpdateController）；Xcode 把 Sparkle.framework 嵌进 Contents/Frameworks 并签名
      - target: SwitcherCameraExtension      # W3-C：嵌到 Contents/Library/SystemExtensions/
        embed: true
        codeSign: true

  # W3-C：虚拟摄像头的 CMIO 系统扩展（CameraExtension/）。产品名 = bundle ID（系统扩展的 bundle 名要求）。
  # 共享常量从 SwitcherVirtualCamera 的 Shared/ 目录按路径编进来。签名需要 Team ID（DEVELOPMENT_TEAM）；没有只能编译。
  SwitcherCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: CameraExtension/Sources
      - path: Packages/SwitcherOutputs/Sources/VirtualCamera/Shared
      - path: CameraExtension/Resources      # W4-B：en / zh-Hans 的 InfoPlist.strings（系统设置里的扩展显示名，prompt 71 第 9 条）
    settings:
      base:
        PRODUCT_NAME: com.plusmix.switcher.camera-extension
        PRODUCT_BUNDLE_IDENTIFIER: com.plusmix.switcher.camera-extension
        INFOPLIST_FILE: CameraExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  SwitcherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plusmix.switcher.tests
        GENERATE_INFOPLIST_FILE: YES
        # W4-D：XcodeGen 按宿主 target 的名字（Switcher）推 TEST_HOST，不看它的 PRODUCT_NAME（PlusMix），所以这里写死成产品名的路径
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PlusMix.app/Contents/MacOS/PlusMix"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Switcher

schemes:
  Switcher:
    build:
      targets:
        Switcher: all
        SwitcherCameraExtension: all
        SwitcherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SwitcherTests
    profile:
      config: Release
    archive:
      config: Release
