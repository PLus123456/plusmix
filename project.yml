# Switcher.xcodeproj 由本文件生成：`make gen`（XcodeGen）。生成物不入库。
# 归属：P0 建骨架；W3-C 加 CameraExtension target；W4-B 做签名 / 公证 / 版本（docs/OWNERSHIP.md）。
name: Switcher

options:
  bundleIdPrefix: com.plusmix            # 用户 2026-09-28 定（产品名 PlusMix）；G5 用 scripts/release/set-bundle-id.sh 切换，发布后不能改
  deploymentTarget:
    macOS: "15.0"                        # 落地方案 §7 第 8 条：NSView.displayLink 需要 14+，矩阵取当前和上一个大版本
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"           # 必须与 Packages/SwitcherCore/Sources/SwitcherContracts/Version.swift 一致（lint 校验）
    CURRENT_PROJECT_VERSION: "1"
    # Team ID 走环境变量：`DEVELOPMENT_TEAM=XXXXXXXXXX make gen`。不设则为空，走 ad-hoc 签名（"Sign to Run Locally"）。
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SwitcherCore:
    path: Packages/SwitcherCore
  SwitcherInputs:
    path: Packages/SwitcherInputs
  SwitcherAudio:
    path: Packages/SwitcherAudio
  SwitcherOutputs:
    path: Packages/SwitcherOutputs
  SwitcherControl:
    path: Packages/SwitcherControl
  SwitcherTestKit:
    path: Packages/SwitcherTestKit
  # W4-B：自动更新（MIT）。二进制 xcframework，钉死版本；升级时 scripts/xcode-workspace-Package.resolved 的 sparkle 一项一起改（scripts/release/pin-deps.sh upgrade）。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Switcher:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: PlusMix                # W4-D：产品名（用户 2026-09-28 定）→ PlusMix.app / CFBundleName / 可执行名；target / scheme / 模块仍叫代码名 Switcher
        PRODUCT_BUNDLE_IDENTIFIER: com.plusmix.switcher
        INFOPLIST_FILE: App/Info.plist   # 手写，见文件内注释；不用 XcodeGen 生成（它会把版本写死成 1.0）
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # W4-B：Sparkle 的两个 Info.plist 键从构建设置注入（App/Info.plist 里写 $(SPARKLE_FEED_URL) / $(SPARKLE_PUBLIC_ED_KEY)）。
        # 默认空 = 这份构建不带更新（UpdateController 不起 Sparkle，偏好设置里写"未配置"）；发布构建由 scripts/release/archive.sh 用
        # xcodebuild 的命令行设置传真实值（SPARKLE_FEED_URL / SPARKLE_PUBLIC_ED_KEY 环境变量），私钥永远不进仓库（docs/release/sparkle.md）。
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
        # W4-B：公证要求硬化运行时。ad-hoc 签名时 Xcode 自己会关掉它（构建日志 note: Disabling hardened runtime with ad-hoc codesigning），
        # 有 Team ID 时生效：摄像头 / 麦克风要 App/Switcher-signed.entitlements 里的 device.camera / device.audio-input 两条，
        # 包内的 libndi.dylib / Sparkle.framework 要用同一 Team ID 重签（库校验），scripts/release/sign.sh 做。
        ENABLE_HARDENED_RUNTIME: YES
        # W3-C：权限表按 DEVELOPMENT_TEAM 选——空（ad-hoc）用空表 App/Switcher.entitlements，有 Team ID 用 App/Switcher-signed.entitlements
        # （system-extension.install 是受限权限，ad-hoc 带着它 Xcode 拒绝构建）。写法：$(DEVELOPMENT_TEAM:default=adhoc) → "adhoc" 或 Team ID，
        # 再查 SWITCHER_ENTITLEMENTS_<它>，只定义了 adhoc 那个，其他（任何 Team ID）落到 default 的签名表。
        SWITCHER_TEAM_KIND: "$(DEVELOPMENT_TEAM:default=adhoc)"
        SWITCHER_ENTITLEMENTS_adhoc: App/Switcher.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(SWITCHER_ENTITLEMENTS_$(SWITCHER_TEAM_KIND):default=App/Switcher-signed.entitlements)"
    dependencies:
      - package: SwitcherCore
        product: SwitcherContracts
      - package: SwitcherCore
        product: SwitcherEngine
      - package: SwitcherCore
        product: SwitcherRender
      - package: SwitcherInputs
      - package: SwitcherInputs
        product: SwitcherNDI                 # G4：App 接 W3-A 的 NDI 输入（InputFactory）
      - package: SwitcherInputs
        product: SwitcherDeckLink            # G4：App 接 W3-A 的 DeckLink 输入（InputFactory）
      - package: SwitcherAudio
      - package: SwitcherAudio
        product: SwitcherAudioIntegration   # W2-B2：App 接 W2-E 的 AudioEngine
      - package: SwitcherOutputs
      - package: SwitcherOutputs
        product: SwitcherStreaming           # W2-B2：App 接 W2-D 的 StreamOutput
      - package: SwitcherOutputs
        product: SwitcherNDISend             # W3-E3：App 接 W2-D 的 NDISender（OutputRuntime 的 kind = ndi）
      - package: SwitcherOutputs
        product: SwitcherExternal            # W3-C：外部显示窗口
      - package: SwitcherOutputs
        product: SwitcherISO                 # W3-C：ISO 分路 + 磁盘保护
      - package: SwitcherOutputs
        product: SwitcherVirtualCamera       # W3-C：虚拟摄像头桥 + 扩展安装
      - package: SwitcherControl
      - package: SwitcherControl
        product: VMixCompat                  # G4：偏好设置里的第三方 API 兼容层开关（W3-D）
      - package: SwitcherTestKit
      - package: Sparkle                     # W4-B：自动更新（UpdateController）；Xcode 把 Sparkle.framework 嵌进 Contents/Frameworks 并签名
      - target: SwitcherCameraExtension      # W3-C：嵌到 Contents/Library/SystemExtensions/
        embed: true
        codeSign: true

  # W3-C：虚拟摄像头的 CMIO 系统扩展（CameraExtension/）。产品名 = bundle ID（系统扩展的 bundle 名要求）。
  # 共享常量从 SwitcherVirtualCamera 的 Shared/ 目录按路径编进来。签名需要 Team ID（DEVELOPMENT_TEAM）；没有只能编译。
  SwitcherCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: CameraExtension/Sources
      - path: Packages/SwitcherOutputs/Sources/VirtualCamera/Shared
      - path: CameraExtension/Resources      # W4-B：en / zh-Hans 的 InfoPlist.strings（系统设置里的扩展显示名，prompt 71 第 9 条）
    settings:
      base:
        PRODUCT_NAME: com.plusmix.switcher.camera-extension
        PRODUCT_BUNDLE_IDENTIFIER: com.plusmix.switcher.camera-extension
        INFOPLIST_FILE: CameraExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  SwitcherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plusmix.switcher.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Switcher

schemes:
  Switcher:
    build:
      targets:
        Switcher: all
        SwitcherCameraExtension: all
        SwitcherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SwitcherTests
    profile:
      config: Release
    archive:
      config: Release
