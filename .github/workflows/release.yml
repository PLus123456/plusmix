# W4-B：打 v* tag（或手动触发）→ make archive（Developer ID 签名 → 校验 → DMG → 公证 + staple）→ appcast → GitHub Release 草稿。
# Secrets（仓库 Settings → Secrets and variables → Actions）：
#   DEVELOPMENT_TEAM            Team ID
#   DEVELOPER_ID_P12_BASE64     "Developer ID Application" 证书 + 私钥导出的 .p12（base64）
#   DEVELOPER_ID_P12_PASSWORD   .p12 的口令
#   NOTARY_KEY_ID / NOTARY_KEY_ISSUER / NOTARY_KEY_P8_BASE64   App Store Connect API 密钥（公证）
#   SPARKLE_PRIVATE_KEY         scripts/release/sparkle-keys.sh export 出来的私钥文件内容
# Variables：SPARKLE_FEED_URL（appcast 的固定地址）、SPARKLE_PUBLIC_ED_KEY（公钥 base64）
# 没配 secrets 时本工作流在"导入证书"那步失败——不会退成 ad-hoc 发布（发布包必须签名公证）。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_notarize:
        description: 跳过公证（只验证签名与打包）
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NSUnbufferedIO: "YES"
  DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
  SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
  SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
  NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
  NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}

jobs:
  archive:
    name: 签名、公证、DMG、appcast
    runs-on: [self-hosted, macOS, ARM64, switcher]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 版本号与 tag 一致
        id: ver
        run: |
          ver=$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([0-9][0-9A-Za-z.-]*\)"\{0,1\}.*/\1/p' project.yml | head -1)
          case "$GITHUB_REF_NAME" in
            v*) [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME 与 project.yml 的 MARKETING_VERSION $ver 不一致（版本号归 G5 改）"; exit 1; } ;;
          esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: 导入 Developer ID 证书到临时钥匙串
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/release/ci-keychain.sh import

      - name: 公证密钥
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          [ -n "$NOTARY_KEY_P8_BASE64" ] || { echo "::error::没有 NOTARY_KEY_P8_BASE64"; exit 1; }
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: make archive
        run: |
          flags=""
          if [ "${{ inputs.skip_notarize }}" = "true" ]; then flags="--skip-notarize"; fi
          caffeinate -i make archive ARCHIVE_FLAGS="$flags"

      - name: appcast（用 secret 里的私钥签）
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::没有 SPARKLE_PRIVATE_KEY"; exit 1; }
          dir=".build/release/$VERSION"
          scripts/release/changelog.sh "$VERSION" > "$dir/Switcher-$VERSION.md" 2>/dev/null || echo "（本版本没有变更日志小节）" > "$dir/Switcher-$VERSION.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | scripts/release/appcast.sh "$dir" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" --embed-release-notes

      - name: 清理钥匙串与密钥
        if: always()
        run: |
          scripts/release/ci-keychain.sh cleanup
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: 收集产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.version }}-${{ github.run_id }}
          path: |
            .build/release/${{ steps.ver.outputs.version }}/Switcher-*.dmg
            .build/release/${{ steps.ver.outputs.version }}/Switcher-*.dmg.sha256
            .build/release/${{ steps.ver.outputs.version }}/appcast.xml
            .build/release/${{ steps.ver.outputs.version }}/release-report.md
            .build/release/${{ steps.ver.outputs.version }}/verify.json
            .build/release/${{ steps.ver.outputs.version }}/logs/**
          if-no-files-found: error
          retention-days: 90

      - name: GitHub Release（草稿，人工检查后发布）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dir=".build/release/$VERSION"
          gh release create "$GITHUB_REF_NAME" --draft --title "Switcher $VERSION" --notes-file "$dir/Switcher-$VERSION.md" \
            "$dir/Switcher-$VERSION.dmg" "$dir/Switcher-$VERSION.dmg.sha256" "$dir/appcast.xml" "$dir/release-report.md"
